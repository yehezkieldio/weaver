services:
  postgres:
    container_name: weaver-postgres
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: elizielx
      POSTGRES_PASSWORD: elizielx
      POSTGRES_DB: weaver
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - weaver-network
networks:
  weaver-network:
    driver: bridge
volumes:
  postgres_data:
